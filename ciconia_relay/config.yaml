name: Ciconia Relay
version: "0.2.0"
slug: ciconia_relay
description: Receive your GPS trackers yourself and see them in Home Assistant. No cloud.
url: https://getciconia.com/docs/
arch:
  - aarch64
  - amd64
init: false
# Device-based MQTT discovery needs Home Assistant 2024.11 or newer.
homeassistant: "2024.11.0"
# Pre-built and signed by CI (multi-arch). make-app.sh drops this line, so a
# copy in local_apps is built on the device instead.
image: ghcr.io/getciconia/ciconia-relay-app
ingress: true
ingress_port: 8080
panel_icon: mdi:map-marker-radius
panel_title: Ciconia Relay
# Reads its own published port and the machine's address, for the Loxone template.
hassio_api: true
# Asks Home Assistant which device is each tracker's, to link to its page.
homeassistant_api: true
# Uses the Mosquitto broker app when it's installed, for MQTT discovery.
services:
  - mqtt:want
ports:
  5027/tcp: 5027
  5028/tcp: 5028
  8080/tcp: null
map:
  - type: ssl
options:
  retention_days: 7
  log_packets: false
  mqtt: true
schema:
  retention_days: int(1,3650)
  log_packets: bool
  mqtt: bool
  mqtt_server: str?
  mqtt_username: str?
  mqtt_password: password?
  tls_hosts: str?
  certfile: str?
  keyfile: str?
  map_tiles: url?
